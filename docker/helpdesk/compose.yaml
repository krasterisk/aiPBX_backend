name: aipbx-helpdesk
services:
  postgres:
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - postgres17_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-helpdesk.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U helpdesk -d n8n']
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  n8n:
    image: n8nio/n8n:2.42.5
    restart: unless-stopped
    ports: ['127.0.0.1:5678:5678']
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: helpdesk
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ipbx.krasterisk.ru
      N8N_PORT: '5678'
      N8N_PROTOCOL: https
      N8N_PATH: /helpdesk/
      N8N_EDITOR_BASE_URL: https://ipbx.krasterisk.ru/helpdesk/
      WEBHOOK_URL: https://ipbx.krasterisk.ru/helpdesk/
      N8N_PROXY_HOPS: '1'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_COMMUNITY_PACKAGES_ENABLED: 'false'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_PUBLIC_API_DISABLED: 'true'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '168'
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      GENERIC_TIMEZONE: Asia/Krasnoyarsk
      TZ: Asia/Krasnoyarsk
      NODE_OPTIONS: --max-old-space-size=512
    volumes: [n8n_data:/home/node/.n8n]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 768m
    logging: *logging
  bridge:
    build: .
    restart: unless-stopped
    env_file: integrations.env
    ports: ['127.0.0.1:8088:8080']
    environment:
      DATABASE_URL: postgresql://helpdesk:${POSTGRES_PASSWORD}@postgres:5432/helpdesk
      BRIDGE_TOKEN: ${BRIDGE_TOKEN}
      PROCESSING_ENABLED: 'true'
    volumes: ['./private:/private']
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 192m
    logging: *logging
volumes:
  postgres_data:
  postgres17_data:
  n8n_data:
